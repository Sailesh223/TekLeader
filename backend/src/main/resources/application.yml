spring:
  application:
    name: tekleader

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/tekleader}
      database: ${SPRING_DATA_MONGODB_DATABASE:tekleader}
      auto-index-creation: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: tekleader-badge-notifications
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.tekion.tekleader.event

# Kafka Topics Configuration
tekleader:
  kafka:
    topics:
      badge-awarded: badge-awarded-events
      achievement-unlocked: achievement-unlocked-events
      feed-post-created: feed-post-created-events

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: INFO
    com.tekion.tekleader: DEBUG
    org.springframework.data.mongodb: DEBUG

# Slack Webhook Configuration
slack:
  webhook-url: ${SLACK_WEBHOOK_URL:}
  channel: ${SLACK_CHANNEL:#tekleader-badges}

