spring:
  application:
    name: tekleader

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/tekleader}
      database: ${SPRING_DATA_MONGODB_DATABASE:tekleader}
      auto-index-creation: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: INFO
    com.tekion.tekleader: DEBUG
    org.springframework.data.mongodb: DEBUG

